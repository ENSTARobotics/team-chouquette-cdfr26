[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ensta-gros-robot"
version = "0.1.0"
description = "Contrôle Raspberry Pi et ESP32 du gros robot ENSTA"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "numpy>=1.24", "opencv-contrib-python>=4.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
